services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-keeperpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keeperpilot}
      POSTGRES_DB: ${POSTGRES_DB:-keeperpilot}
    ports:
      - "5432:5432"
    volumes:
      - keeperpilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keeperpilot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-keeperpilot}:${POSTGRES_PASSWORD:-keeperpilot}@postgres:5432/${POSTGRES_DB:-keeperpilot}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  keeperpilot_pgdata:
